services:
  zipgo:
    build:
      context: docker
      # Pin a release with: ZIPGO_VERSION=v1.2.3 docker compose build
      args:
        ZIPGO_VERSION: ${ZIPGO_VERSION:-latest}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Your sites: one folder per domain (e.g. ./domains/example.com/)
      - ./domains:/domains
      # Persist Let's Encrypt certificates across restarts
      - zipgo-data:/root/.local/share/caddy
    restart: unless-stopped

volumes:
  zipgo-data:
