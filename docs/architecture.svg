<svg width="720" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg"
  style="background:#0f172a;border-radius:12px;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
      orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Internet / Client -->
  <rect x="290" y="20" width="140" height="44" rx="8" fill="#1e293b" stroke="#475569"
    stroke-width="0.5" />
  <text x="360" y="42" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#e2e8f0">Internet / browser</text>

  <!-- Arrow down to Caddy -->
  <line x1="360" y1="64" x2="360" y2="108" stroke="#64748b" stroke-width="1"
    marker-end="url(#arrow)" />
  <text x="372" y="90" dominant-baseline="central" font-size="11" fill="#64748b">:80 / :443</text>

  <!-- Caddy outer container -->
  <rect x="40" y="108" width="640" height="210" rx="14" fill="#26215c" stroke="#534ab7"
    stroke-width="0.5" />
  <text x="360" y="134" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#cecbf6">Caddy (in-memory JSON config, no Caddyfile)</text>

  <!-- TLS badge -->
  <rect x="70" y="148" width="150" height="36" rx="6" fill="#085041" stroke="#0f6e56"
    stroke-width="0.5" />
  <text x="145" y="166" text-anchor="middle" dominant-baseline="central" font-size="12"
    font-weight="500" fill="#9fe1cb">Let's Encrypt TLS</text>

  <!-- HTTP redirect badge -->
  <rect x="236" y="148" width="130" height="36" rx="6" fill="#1e293b" stroke="#334155"
    stroke-width="0.5" />
  <text x="301" y="166" text-anchor="middle" dominant-baseline="central" font-size="12"
    font-weight="500" fill="#94a3b8">HTTP → HTTPS</text>

  <text x="530" y="166" text-anchor="middle" dominant-baseline="central" font-size="11"
    fill="#7c76ce">host → site, from the folder tree</text>

  <!-- Column 1: static sites -->
  <rect x="70" y="204" width="180" height="44" rx="8" fill="#0c447c" stroke="#185fa5"
    stroke-width="0.5" />
  <text x="160" y="220" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#b5d4f4">static / SPA</text>
  <text x="160" y="236" text-anchor="middle" dominant-baseline="central" font-size="10.5"
    fill="#85b7eb">example.com, docs.example.com</text>

  <!-- Column 2: proxy -->
  <rect x="270" y="204" width="180" height="44" rx="8" fill="#0b4a4a" stroke="#157a72"
    stroke-width="0.5" />
  <text x="360" y="220" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#a8e6df">proxy (rewrite)</text>
  <text x="360" y="236" text-anchor="middle" dominant-baseline="central" font-size="10.5"
    fill="#7ecbc1">api.docs.example.com</text>

  <!-- Column 3: redirect -->
  <rect x="470" y="204" width="180" height="44" rx="8" fill="#6b3a06" stroke="#9a5b12"
    stroke-width="0.5" />
  <text x="560" y="220" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#f5c98a">redirect</text>
  <text x="560" y="236" text-anchor="middle" dominant-baseline="central" font-size="10.5"
    fill="#e2ab5f">old.example.com</text>

  <!-- Arrows down from the three columns -->
  <line x1="160" y1="248" x2="160" y2="292" stroke="#64748b" stroke-width="1"
    marker-end="url(#arrow)" />
  <line x1="360" y1="248" x2="360" y2="292" stroke="#64748b" stroke-width="1"
    marker-end="url(#arrow)" />
  <line x1="560" y1="248" x2="560" y2="292" stroke="#64748b" stroke-width="1"
    marker-end="url(#arrow)" />

  <!-- Handler detail boxes -->
  <rect x="90" y="292" width="140" height="56" rx="8" fill="#173404" stroke="#3b6d11"
    stroke-width="0.5" />
  <text x="160" y="314" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#c0dd97">file_server</text>
  <text x="160" y="332" text-anchor="middle" dominant-baseline="central" font-size="10.5"
    fill="#97c459">SPA falls back to index.html</text>

  <rect x="280" y="292" width="160" height="56" rx="8" stroke-dasharray="4 3"
    fill="#0f2e2e" stroke="#157a72" stroke-width="0.75" />
  <text x="360" y="314" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#a8e6df">reverse_proxy</text>
  <text x="360" y="332" text-anchor="middle" dominant-baseline="central" font-size="10.5"
    fill="#7ecbc1">upstream, not the folder</text>

  <rect x="490" y="292" width="140" height="56" rx="8" fill="#3a1f04" stroke="#9a5b12"
    stroke-width="0.5" />
  <text x="560" y="314" text-anchor="middle" dominant-baseline="central" font-size="13"
    font-weight="500" fill="#f5c98a">static_response</text>
  <text x="560" y="332" text-anchor="middle" dominant-baseline="central" font-size="10.5"
    fill="#e2ab5f">301/302 Location header</text>

  <!-- File server reads from disk -->
  <line x1="160" y1="348" x2="160" y2="392" stroke="#64748b" stroke-width="1"
    marker-end="url(#arrow)" />

  <!-- Domains folder on disk -->
  <rect x="60" y="392" width="260" height="40" rx="8" fill="#1e293b" stroke="#334155"
    stroke-width="0.5" />
  <text x="190" y="412" text-anchor="middle" dominant-baseline="central" font-size="12.5"
    font-weight="500" fill="#94a3b8">domains/example.com/  (the tree is the config)</text>

  <!-- security headers note, always applied before any handler -->
  <text x="360" y="194" text-anchor="middle" font-size="10.5" fill="#64748b">every route: security headers first, basicAuth wraps if set</text>

  <!-- Reload dashed loop: disk change -> rebuild Caddy config -->
  <path d="M320 412 L660 412 L660 108" fill="none" stroke="#475569" stroke-width="0.75"
    stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#64748b">file watcher: any change under domains/ → rebuild config → Caddy reload (debounced)</text>
</svg>
