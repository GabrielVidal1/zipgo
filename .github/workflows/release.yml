name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: the build jobs only read the repo; the release job alone
# gets write access, to publish the assets.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The build uses go.mod/go.sum exactly as committed: no tidy at release
      # time, and every module is checked against go.sum.
      - name: Verify dependencies
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          GOFLAGS: -mod=readonly -trimpath
          VERSION: ${{ github.ref_name }}
        run: |
          go build -ldflags="-s -w -X main.version=${VERSION}" \
            -o "zipgo-${GOOS}-${GOARCH}" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zipgo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zipgo-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: dist/

      # checksums.txt is what docker/Dockerfile and the install scripts verify
      # a downloaded binary against.
      - name: Checksum
        working-directory: dist
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true
